services:
  - type: web
    name: highfly-hospitality-staging
    runtime: python
    region: singapore
    plan: free
    buildCommand: >-
      pip install -r apps/api/requirements.txt &&
      cd apps/api &&
      cd ../web &&
      npm ci &&
      npm run build
    startCommand: >-
      cd apps/api &&
      uvicorn app.production:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/ready
    autoDeployTrigger: off
    envVars:
      - key: HMS_ENVIRONMENT
        value: production
      - key: HMS_DATABASE_URL
        fromDatabase:
          name: highfly-hospitality-staging-db
          property: connectionString
      - key: HMS_SECRET_KEY
        generateValue: true
      - key: HMS_TOKEN_EXPIRE_MINUTES
        value: "480"

databases:
  - name: highfly-hospitality-staging-db
    databaseName: highfly_hospitality_staging
    user: highfly_hospitality_staging
    region: singapore
    plan: free
