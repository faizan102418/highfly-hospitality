name: Production readiness smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: production-readiness-smoke
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check live readiness endpoint
        env:
          READINESS_URL: https://highfly-hospitality-dev.onrender.com/api/ready
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_code="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output "$response_file" --write-out '%{http_code}' \
            "$READINESS_URL")"

          if [ "$http_code" != "200" ]; then
            echo "::error::Readiness endpoint returned HTTP $http_code"
            exit 1
          fi

          python - "$response_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("status") != "ready":
              raise SystemExit("Readiness payload did not report status=ready")
          if payload.get("mode") != "postgresql":
              raise SystemExit("Readiness payload did not report mode=postgresql")
          print("PASS: live readiness endpoint returned HTTP 200 and reports ready/PostgreSQL.")
          PY
